<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World | Gallery</title>
  <style>
    :root {
      color-scheme: dark;
      --panel: rgba(19, 24, 32, 0.74);
      --panel-border: rgba(255, 255, 255, 0.14);
      --text: #f5f7fb;
      --muted: #b8c0cc;
      --cyan: #65d9ff;
      --rose: #ff6f91;
      --gold: #ffd166;
      --green: #6ee7b7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 18% 22%, rgba(101, 217, 255, 0.2), transparent 28rem),
        radial-gradient(circle at 86% 72%, rgba(255, 209, 102, 0.18), transparent 30rem),
        linear-gradient(135deg, #111827 0%, #0e1116 48%, #151b22 100%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .site-nav {
      position: fixed;
      top: 1rem;
      left: 50%;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 0.45rem;
      width: min(calc(100% - 2rem), 860px);
      padding: 0.5rem;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      background: rgba(14, 17, 22, 0.78);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      backdrop-filter: blur(18px);
      transform: translateX(-50%);
    }

    .brand {
      margin-right: auto;
      padding: 0.65rem 0.8rem;
      color: var(--text);
      font-weight: 800;
      text-decoration: none;
    }

    .nav-link {
      padding: 0.65rem 0.85rem;
      border-radius: 7px;
      color: var(--muted);
      text-decoration: none;
      font-weight: 700;
      transition: color 180ms ease, background 180ms ease;
    }

    .nav-link:hover,
    .nav-link.active {
      color: var(--text);
      background: rgba(255, 255, 255, 0.1);
    }

    .stage {
      position: relative;
      width: min(94vw, 980px);
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0 auto;
      padding: 7rem 2rem 4rem;
    }

    .grid {
      position: absolute;
      inset: -35vh -35vw;
      z-index: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.07) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: radial-gradient(circle at center, black 0%, transparent 68%);
      animation: drift 18s linear infinite;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      overflow: hidden;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: clamp(2rem, 5vw, 4rem);
      background: var(--panel);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(20px);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      margin: 0 0 1.2rem;
      color: var(--cyan);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .spark {
      width: 0.7rem;
      height: 0.7rem;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 22px var(--cyan);
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 8vw, 6.8rem);
      line-height: 0.92;
      letter-spacing: 0;
    }

    .accent {
      background: linear-gradient(90deg, var(--cyan), var(--gold), var(--rose));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p {
      max-width: 42rem;
      margin: 1.3rem 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.18rem);
      line-height: 1.7;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1rem;
      margin-top: 2rem;
    }

    .piece {
      position: relative;
      min-height: 13rem;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 8px;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.12), transparent 42%),
        var(--art);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14);
      transition: transform 180ms ease, border-color 180ms ease;
    }

    .piece:hover {
      transform: translateY(-4px);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .piece:nth-child(1) {
      --art: radial-gradient(circle at 30% 28%, #65d9ff, transparent 34%), linear-gradient(135deg, #1f2937, #ff6f91);
      grid-row: span 2;
    }

    .piece:nth-child(2) {
      --art: radial-gradient(circle at 70% 24%, #ffd166, transparent 30%), linear-gradient(135deg, #102a43, #6ee7b7);
    }

    .piece:nth-child(3) {
      --art: radial-gradient(circle at 34% 70%, #ff6f91, transparent 32%), linear-gradient(135deg, #20202a, #65d9ff);
    }

    .piece:nth-child(4) {
      --art: radial-gradient(circle at 74% 64%, #6ee7b7, transparent 34%), linear-gradient(135deg, #30213d, #ffd166);
      grid-column: span 2;
    }

    .piece:nth-child(5) {
      --art: radial-gradient(circle at 28% 28%, #ffd166, transparent 28%), linear-gradient(135deg, #152033, #ff6f91);
    }

    .piece span {
      position: absolute;
      left: 1rem;
      bottom: 1rem;
      padding: 0.45rem 0.65rem;
      border-radius: 7px;
      color: var(--text);
      background: rgba(7, 16, 25, 0.58);
      font-weight: 800;
      backdrop-filter: blur(12px);
    }

    @keyframes drift {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(56px, 56px, 0); }
    }

    @media (max-width: 720px) {
      .site-nav {
        flex-wrap: wrap;
        justify-content: center;
      }

      .brand {
        width: 100%;
        margin-right: 0;
        text-align: center;
      }

      .stage {
        width: 100%;
        padding: 11rem 1rem 1rem;
      }

      .card {
        padding: 2rem 1.25rem;
      }

      .gallery {
        grid-template-columns: 1fr;
      }

      .piece,
      .piece:nth-child(1),
      .piece:nth-child(4) {
        grid-column: auto;
        grid-row: auto;
        min-height: 12rem;
      }
    }
  </style>
</head>
<body>
  <nav class="site-nav" aria-label="Main navigation">
    <a class="brand" href="index.html">Hello Studio</a>
    <a class="nav-link" href="index.html">Home</a>
    <a class="nav-link" href="about.html">About</a>
    <a class="nav-link active" href="gallery.html" aria-current="page">Gallery</a>
    <a class="nav-link" href="contact.html">Contact</a>
  </nav>
  <main class="stage">
    <div class="grid" aria-hidden="true"></div>
    <section class="card" aria-label="Hello Studio gallery">
      <div class="eyebrow"><span class="spark"></span> Gallery wall</div>
      <h1>Moments in <span class="accent">color.</span></h1>
      <p>A compact gallery of abstract light studies, built with CSS so the page stays fast, offline-friendly, and visually tied to the rest of the site.</p>
      <div class="gallery" aria-label="Abstract gallery items">
        <div class="piece"><span>Aurora</span></div>
        <div class="piece"><span>Signal</span></div>
        <div class="piece"><span>Pulse</span></div>
        <div class="piece"><span>Horizon</span></div>
        <div class="piece"><span>Bloom</span></div>
      </div>
    </section>
  </main>
</body>
</html>
