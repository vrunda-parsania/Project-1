<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World | Contact</title>
  <style>
    :root {
      color-scheme: dark;
      --panel: rgba(19, 24, 32, 0.74);
      --panel-border: rgba(255, 255, 255, 0.14);
      --text: #f5f7fb;
      --muted: #b8c0cc;
      --cyan: #65d9ff;
      --rose: #ff6f91;
      --gold: #ffd166;
      --green: #6ee7b7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 18% 20%, rgba(255, 111, 145, 0.22), transparent 28rem),
        radial-gradient(circle at 86% 72%, rgba(101, 217, 255, 0.2), transparent 30rem),
        linear-gradient(135deg, #111827 0%, #0e1116 48%, #151b22 100%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .site-nav {
      position: fixed;
      top: 1rem;
      left: 50%;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 0.45rem;
      width: min(calc(100% - 2rem), 860px);
      padding: 0.5rem;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      background: rgba(14, 17, 22, 0.78);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      backdrop-filter: blur(18px);
      transform: translateX(-50%);
    }

    .brand {
      margin-right: auto;
      padding: 0.65rem 0.8rem;
      color: var(--text);
      font-weight: 800;
      text-decoration: none;
    }

    .nav-link {
      padding: 0.65rem 0.85rem;
      border-radius: 7px;
      color: var(--muted);
      text-decoration: none;
      font-weight: 700;
      transition: color 180ms ease, background 180ms ease;
    }

    .nav-link:hover,
    .nav-link.active {
      color: var(--text);
      background: rgba(255, 255, 255, 0.1);
    }

    .stage {
      position: relative;
      width: min(92vw, 860px);
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0 auto;
      padding: 7rem 2rem 4rem;
    }

    .grid {
      position: absolute;
      inset: -35vh -35vw;
      z-index: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.07) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: radial-gradient(circle at center, black 0%, transparent 68%);
      animation: drift 18s linear infinite;
    }

    .card {
      position: relative;
      z-index: 1;
      overflow: hidden;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: clamp(2rem, 7vw, 5rem);
      background: var(--panel);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(20px);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      margin: 0 0 1.4rem;
      color: var(--rose);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .spark {
      width: 0.7rem;
      height: 0.7rem;
      border-radius: 50%;
      background: var(--rose);
      box-shadow: 0 0 22px var(--rose);
    }

    h1 {
      margin: 0;
      max-width: 12ch;
      font-size: clamp(3rem, 9vw, 7rem);
      line-height: 0.92;
      letter-spacing: 0;
    }

    .accent {
      display: block;
      background: linear-gradient(90deg, var(--rose), var(--cyan), var(--green));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p {
      max-width: 38rem;
      margin: 1.4rem 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.2rem);
      line-height: 1.7;
    }

    form {
      display: grid;
      gap: 0.9rem;
      margin-top: 2rem;
    }

    label {
      display: grid;
      gap: 0.45rem;
      color: var(--text);
      font-weight: 700;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      padding: 0.9rem 1rem;
      color: var(--text);
      background: rgba(255, 255, 255, 0.08);
      font: inherit;
      outline: none;
    }

    textarea {
      min-height: 8rem;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: rgba(101, 217, 255, 0.72);
      box-shadow: 0 0 0 3px rgba(101, 217, 255, 0.18);
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 3rem;
      width: fit-content;
      padding: 0 1.1rem;
      border: 0;
      border-radius: 8px;
      color: #071019;
      background: linear-gradient(90deg, #65d9ff, #ff6f91);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      transition: transform 180ms ease;
    }

    .button:hover {
      transform: translateY(-2px);
    }

    @keyframes drift {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(56px, 56px, 0); }
    }

    @media (max-width: 640px) {
      .site-nav {
        flex-wrap: wrap;
        justify-content: center;
      }

      .brand {
        width: 100%;
        margin-right: 0;
        text-align: center;
      }

      .stage {
        width: 100%;
        padding: 10rem 1rem 1rem;
      }

      .card {
        padding: 2rem 1.25rem;
      }

      .button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <nav class="site-nav" aria-label="Main navigation">
    <a class="brand" href="index.html">Hello Studio</a>
    <a class="nav-link" href="index.html">Home</a>
    <a class="nav-link" href="about.html">About</a>
    <a class="nav-link active" href="contact.html" aria-current="page">Contact</a>
  </nav>
  <main class="stage">
    <div class="grid" aria-hidden="true"></div>
    <section class="card" aria-label="Contact Hello Studio">
      <div class="eyebrow"><span class="spark"></span> Start a conversation</div>
      <h1>Send a <span class="accent">hello.</span></h1>
      <p>Drop a quick note below. This form is ready for a future backend, and for now it keeps the contact page feeling complete and easy to explore.</p>
      <form action="#" method="post">
        <label>
          Name
          <input type="text" name="name" placeholder="Your name" autocomplete="name">
        </label>
        <label>
          Email
          <input type="email" name="email" placeholder="you@example.com" autocomplete="email">
        </label>
        <label>
          Message
          <textarea name="message" placeholder="Write your message..."></textarea>
        </label>
        <button class="button" type="submit">Send Message</button>
      </form>
    </section>
  </main>
</body>
</html>
