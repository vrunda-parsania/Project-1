<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World | Home</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0e1116;
      --panel: rgba(19, 24, 32, 0.74);
      --panel-border: rgba(255, 255, 255, 0.14);
      --text: #f5f7fb;
      --muted: #b8c0cc;
      --cyan: #65d9ff;
      --rose: #ff6f91;
      --gold: #ffd166;
      --green: #6ee7b7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 16% 18%, rgba(101, 217, 255, 0.24), transparent 28rem),
        radial-gradient(circle at 86% 74%, rgba(255, 111, 145, 0.22), transparent 30rem),
        linear-gradient(135deg, #111827 0%, #0e1116 46%, #151b22 100%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .site-nav {
      position: fixed;
      top: 1rem;
      left: 50%;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 0.45rem;
      width: min(calc(100% - 2rem), 860px);
      padding: 0.5rem;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      background: rgba(14, 17, 22, 0.78);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      backdrop-filter: blur(18px);
      transform: translateX(-50%);
    }

    .brand {
      margin-right: auto;
      padding: 0.65rem 0.8rem;
      color: var(--text);
      font-weight: 800;
      text-decoration: none;
    }

    .nav-link {
      padding: 0.65rem 0.85rem;
      border-radius: 7px;
      color: var(--muted);
      text-decoration: none;
      font-weight: 700;
      transition: color 180ms ease, background 180ms ease;
    }

    .nav-link:hover,
    .nav-link.active {
      color: var(--text);
      background: rgba(255, 255, 255, 0.1);
    }

    .stage {
      position: relative;
      width: min(92vw, 860px);
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0 auto;
      padding: 7rem 2rem 4rem;
    }

    .grid {
      position: absolute;
      inset: -35vh -35vw;
      z-index: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.07) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: radial-gradient(circle at center, black 0%, transparent 68%);
      animation: drift 18s linear infinite;
    }

    .card {
      position: relative;
      z-index: 1;
      overflow: hidden;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: clamp(2rem, 7vw, 5rem);
      background: var(--panel);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(20px);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(120deg, transparent 0%, rgba(255, 255, 255, 0.18) 42%, transparent 58%);
      transform: translateX(-100%);
      animation: shine 7s ease-in-out infinite;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      margin: 0 0 1.4rem;
      color: var(--green);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .spark {
      width: 0.7rem;
      height: 0.7rem;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 22px var(--green);
    }

    h1 {
      margin: 0;
      max-width: 12ch;
      font-size: clamp(3.2rem, 11vw, 8.5rem);
      line-height: 0.88;
      letter-spacing: 0;
    }

    .accent {
      display: block;
      background: linear-gradient(90deg, var(--cyan), var(--gold), var(--rose));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p {
      max-width: 36rem;
      margin: 1.6rem 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.2vw, 1.25rem);
      line-height: 1.7;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.9rem;
      margin-top: 2rem;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 3rem;
      padding: 0 1.1rem;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      color: var(--text);
      text-decoration: none;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.08);
      transition: transform 180ms ease, background 180ms ease, border-color 180ms ease;
    }

    .button:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.34);
      background: rgba(255, 255, 255, 0.14);
    }

    .button.primary {
      border-color: transparent;
      background: linear-gradient(90deg, #65d9ff, #ff6f91);
      color: #071019;
    }

    @keyframes drift {
      from {
        transform: translate3d(0, 0, 0);
      }

      to {
        transform: translate3d(56px, 56px, 0);
      }
    }

    @keyframes shine {
      0%, 60% {
        transform: translateX(-100%);
      }

      80%, 100% {
        transform: translateX(100%);
      }
    }

    @media (max-width: 560px) {
      .site-nav {
        flex-wrap: wrap;
        justify-content: center;
      }

      .brand {
        width: 100%;
        margin-right: 0;
        text-align: center;
      }

      .stage {
        width: 100%;
        padding: 10rem 1rem 1rem;
      }

      .card {
        padding: 2rem 1.25rem;
      }

      h1 {
        font-size: clamp(3rem, 20vw, 5.8rem);
      }

      .button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <nav class="site-nav" aria-label="Main navigation">
    <a class="brand" href="index.html">Hello Studio</a>
    <a class="nav-link active" href="index.html" aria-current="page">Home</a>
    <a class="nav-link" href="about.html">About</a>
    <a class="nav-link" href="gallery.html">Gallery</a>
    <a class="nav-link" href="contact.html">Contact</a>
  </nav>
  <main class="stage">
    <div class="grid" aria-hidden="true"></div>
    <section class="card" aria-label="Hello world welcome">
      <div class="eyebrow"><span class="spark"></span> Freshly launched</div>
      <h1>Hello <span class="accent">World.</span></h1>
      <p>A tiny page with a little polish: glassy depth, animated light, crisp type, and a warm first greeting from this folder.</p>
      <div class="actions" aria-label="Page actions">
        <a class="button primary" href="contact.html" aria-label="Say hello">Say Hello</a>
        <a class="button" href="about.html" aria-label="Look around">Look Around</a>
      </div>
    </section>
  </main>
</body>
</html>
